services:
  - type: web
    name: arts-attendance-platform
    env: node
    plan: free
    buildCommand: npm install && node scripts/prepare-postgres.cjs && npm run build
    startCommand: npm run deploy
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: attendance-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DEVELOPER_USERNAME
        value: developer
      - key: DEVELOPER_PASSWORD
        generateValue: true

databases:
  - name: attendance-db
    plan: free
